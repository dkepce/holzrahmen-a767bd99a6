<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Holzrahmen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b2f26">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="pIns" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fbf1c7"/><path d="M0 4.5 L1.5 1.5 L3 4.5 L4.5 1.5 L6 4.5" fill="none" stroke="#d1b24b" stroke-width=".5"/></pattern>
  <pattern id="pWood" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#e3c08d"/><path d="M0 0 L4 4 M4 0 L0 4" stroke="#8a6330" stroke-width=".35"/></pattern>
  <pattern id="pAufb" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#e9efe3"/><path d="M0 5 L5 0" stroke="#9aab8b" stroke-width=".4"/></pattern>
</defs></svg>
<div id="app">
  <header id="top">
    <b class="brand">Holzrahmen</b>
    <nav id="tabs">
      <button class="tab on" data-view="katalog">Katalog</button>
      <button class="tab" data-view="legende">Legende</button>
    </nav>
    <span class="grow"></span>
    <button id="btnFile" class="pill" title="Where your data is saved">Saved in this browser</button>
  </header>
  <main id="stage"></main>
</div>

<dialog id="dlgFile">
  <h3>Where is your data saved?</h3>
  <p id="fileInfo"></p>
  <div class="row">
    <button id="btnChoose" class="primary">Choose folder…</button>
    <button id="btnReconnect">Reconnect</button>
    <button id="btnBackup">Download backup</button>
    <label class="btn">Restore backup… <input id="fileRestore" type="file" accept=".hrm,application/json" hidden></label>
    <button id="btnUnlink">Stop using folder</button>
    <button id="btnCloseFile" value="close">Close</button>
  </div>
</dialog>
<div id="toast" role="status"></div>

<!-- load order matters: each file adds to window.APP -->
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/catalog.js"></script>
<script src="js/geom.js"></script>
<script src="js/draw.js"></script>
<script src="js/app.js"></script>
<script src="js/init.js"></script>
</body>
</html>
